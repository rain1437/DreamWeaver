name: 部署到 GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'build.js'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布目录
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 重新构建（确保产物与源码一致）
        run: node build.js

      - name: 结构自检（不过就不发布）
        run: node verify.js

      - name: 组装发布目录
        run: node tools/build-site.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ 默认不打包 dotfiles，不加这行会丢掉 .nojekyll（Pages 就会走 Jekyll）
          include-hidden-files: true

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: 发版（打 tag 自动打包）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并创建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建 + 测试
        run: |
          node build.js
          node tools/make-icons.js
          node tools/run-tests.js

      - name: 组装发布目录
        run: node tools/build-site.js

      - name: 打包单文件应用与网站包
        run: |
          cp ai-novel-studio-mobile.html DreamWeaver-单文件版.html
          cd dist && zip -r ../DreamWeaver-网站包.zip . && cd ..

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          name: DreamWeaver ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            DreamWeaver-单文件版.html
            DreamWeaver-网站包.zip
